[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
authors = ["Olivier Le Guyader"]
publish = true

[workspace.dependencies]
kapel-core = { path = "crates/kapel-core", version = "0.1.0" }
kapel-ops = { path = "crates/kapel-ops", version = "0.1.0" }
kapel-ref = { path = "crates/kapel-ref", version = "0.1.0" }
kapel-cpu = { path = "crates/kapel-cpu", version = "0.1.0" }
kapel-cuda = { path = "crates/kapel-cuda", version = "0.1.0" }
kapel-cuda-abi = { path = "crates/kapel-cuda-abi", version = "0.1.0" }
kapel-hub = { path = "crates/kapel-hub", version = "0.1.0" }
kapel-tokenizers = { path = "crates/kapel-tokenizers", version = "0.1.0" }
kapel-models = { path = "crates/kapel-models", version = "0.1.0" }
kapel-infer = { path = "crates/kapel-infer", version = "0.1.0" }
kapel-train = { path = "crates/kapel-train", version = "0.1.0" }
kapel-serve = { path = "crates/kapel-serve", version = "0.1.0" }
kapel-quant = { path = "crates/kapel-quant", version = "0.1.0" }
kapel-runtime = { path = "crates/kapel-runtime", version = "0.1.0" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
fancy-regex = "0.16"
futures-util = { version = "0.3", default-features = false }
llguidance = { version = "1.9", default-features = false, features = ["lark", "referencing", "ahash"] }
memmap2 = "0.9"
minijinja = { version = "2", features = ["loop_controls", "json", "fuel"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
ureq = "2"
unicode-normalization = "0.1"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
debug = "line-tables-only"

# cutile-rs compiles tile kernels without optimization when its compiler crate is
# built with debug information (any level: Cargo only says whether there is
# some). Kernels are always optimized here; `CUDA_RUST_DEBUG=line` or `full`
# brings device debug information back when needed.
[profile.release.package.cutile-compiler]
debug = false

[profile.dev.package.cutile-compiler]
debug = false
