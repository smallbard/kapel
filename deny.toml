# cargo deny check: licenses, advisories, duplicate and unknown sources.

[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    # MIT without its attribution clause (borrow-or-share, through the JSON
    # schema references of llguidance).
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[advisories]
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
