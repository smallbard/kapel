# Qwen 3 0.6B trained by DPO with LoRA on 4,000 pairs of UltraFeedback, the
# settings of TRL's reference (tools/train/trl_dpo.py): The Kapel Book,
# section 16.4.
#
#   python tools/train/ultrafeedback.py recipes/dpo-ultrafeedback/ultrafeedback
#   kapel train recipes/dpo-ultrafeedback/train.toml
#
# Each step: 8 pairs, 16 rows of at most 1,024 tokens in two passes of 8
# rows, the reference the model without its adapters; the 500 pairs of the
# test held out, measured every 100 steps.
#
# Expected: see recipes/README.md.

[model]
config = "Qwen/Qwen3-0.6B"
init = "weights"

[batch]
rows = 8
length = 1024
tokens = 16384

[optimizer]
kind = "adamw"
lr = 5e-5
beta1 = 0.9
beta2 = 0.999
eps = 1e-8
weight_decay = 0.0

[schedule]
kind = "linear"
steps = 500

[training]
device = "cuda"
dtype = "bf16"
clip = 1.0
chunk = 1024

[eval]
every = 100
tokens = 0

[checkpoint]
dir = "run"
every = 0

[log]
every = 10

[data]
pack = "joined"          # the 8 answers of a pass in one row, no padding

[lora]
r = 16
alpha = 32
targets = ["all-linear"]

[dpo]
train = "ultrafeedback/train.jsonl"
val = "ultrafeedback/test.jsonl"
beta = 0.1
