[package]
name = "kapel-cuda-kernels"
description = "Kapel's CUDA kernels, written in Rust and compiled to PTX by cuda-oxide."
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Compiled with `cargo oxide` on the nightly of `rust-toolchain.toml`, apart from
# the stable workspace. `./build.sh` writes the PTX the backend embeds.
[workspace]

[lib]
crate-type = ["rlib"]

[dependencies]
cuda-device = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "a73ec6ef7fe2922c93f5d1e1f2e3de67c891a760" }
kapel-cuda-abi = { path = "../crates/kapel-cuda-abi" }
