[package]
name = "kapel-cuda"
description = "The CUDA backend, built on CUDA Rust (cutile-rs and cuda-oxide)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The backend itself: needs the CUDA toolkit to build and a device to run. Off by
# default, so that the workspace builds anywhere.
cuda = ["dep:cuda-core", "dep:cutile"]

[dependencies]
kapel-core.workspace = true
kapel-ops.workspace = true
kapel-cuda-abi.workspace = true
cuda-core = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "a73ec6ef7fe2922c93f5d1e1f2e3de67c891a760", optional = true }
# Tile kernels, compiled at their first launch by `tileiras` (CUDA 13.2 or later).
cutile = { git = "https://github.com/NVlabs/cuda-oxide.git", rev = "a73ec6ef7fe2922c93f5d1e1f2e3de67c891a760", optional = true }

[dev-dependencies]
kapel-ref.workspace = true

[[example]]
name = "gemm"
required-features = ["cuda"]

[[example]]
name = "attention"
required-features = ["cuda"]

[[example]]
name = "reductions"
required-features = ["cuda"]
