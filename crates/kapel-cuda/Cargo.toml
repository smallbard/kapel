[package]
name = "kapel-cuda"
description = "The CUDA backend, built on CUDA Rust (cutile-rs and cuda-oxide)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The backend itself: needs the CUDA toolkit to build and a device to run. Off by
# default, so that the workspace builds anywhere.
cuda = ["dep:cuda-core", "dep:cuda-bindings", "dep:cutile"]

[dependencies]
kapel-core.workspace = true
kapel-ops.workspace = true
kapel-cuda-abi.workspace = true
cuda-core = { version = "0.4.0", optional = true }
# The driver's graph functions (capture, instantiation, launch), which cuda-core
# does not wrap.
cuda-bindings = { version = "0.4.0", optional = true }
# Tile kernels, compiled at their first launch by `tileiras` (CUDA 13.2 or later).
cutile = { version = "0.4.0", optional = true }

[dev-dependencies]
serde_json.workspace = true
kapel-ref.workspace = true
kapel-cpu.workspace = true
kapel-hub.workspace = true
kapel-models.workspace = true

[[test]]
name = "parity"
required-features = ["cuda"]

[[example]]
name = "gemm"
required-features = ["cuda"]

[[example]]
name = "attention"
required-features = ["cuda"]

[[example]]
name = "reductions"
required-features = ["cuda"]

[[example]]
name = "prefill"
required-features = ["cuda"]

[[example]]
name = "decode"
required-features = ["cuda"]

[[test]]
name = "recorded"
required-features = ["cuda"]

[[example]]
name = "quantized"
required-features = ["cuda"]
