cuda = ["dep:kapel-cuda", "kapel-cuda/cuda"]

[dependencies]
kapel-core.workspace = true
kapel-ops.workspace = true
kapel-models.workspace = true
kapel-hub.workspace = true
serde_json.workspace = true
serde.workspace = true
toml.workspace = true
memmap2.workspace = true
parquet.workspace = true
sha2.workspace = true
kapel-tokenizers.workspace = true
kapel-infer.workspace = true
fancy-regex.workspace = true
kapel-cpu.workspace = true
kapel-cuda = { workspace = true, optional = true }

[dev-dependencies]
kapel-ref.workspace = true
